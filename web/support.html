<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赞助/支持 - AI 猜词</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #1f2a48, #0b1023);
      color: #e8ecf7;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { color: #aab0c7; line-height: 1.65; }
    .actions { margin-top: 22px; display: grid; gap: 12px; }
    a.button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3ee8b5, #2cc7f5);
      color: #04131f;
      font-weight: 700;
      text-decoration: none;
    }
    a.secondary {
      background: rgba(255,255,255,0.08);
      color: #e8ecf7;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .hint { margin-top: 18px; font-size: 13px; color: #8a91a8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>喜欢这个游戏？顺手支持一下吧</h1>
    <p>
      你的小额支持会直接帮我继续打磨词库、优化语义打分、做更好玩的猜词体验。
      目前这是零成本支持，不需要额外下载。
    </p>
    <div class="actions">
      <a class="button" href="https://ko-fi.com/your-link" target="_blank" rel="noopener">☕ 通过 Ko-fi 支持</a>
      <a class="button secondary" href="https://www.buymeacoffee.com/your-link" target="_blank" rel="noopener">❤️ 通过 Buy Me a Coffee 支持</a>
      <a class="button secondary" href="https://github.com/sponsors/your-username" target="_blank" rel="noopener">⭐ 通过 GitHub Sponsors 支持</a>
    </div>
    <p class="hint">把上面链接替换成你自己的收款页，就可以开始零成本收款。</p>
  </main>
</body>
</html>
